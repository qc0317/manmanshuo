[platformio]
src_dir = main

[env:zhengchen-154tft]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = COM5
upload_speed = 115200
upload_flags =
    --before
    no_reset
    --after
    no_reset
monitor_port = COM5
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.psram_type = opi
build_flags =
    -DBOARD_HAS_PSRAM
